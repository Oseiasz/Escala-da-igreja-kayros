    <title>Escala Igreja - Black & Green</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>

        darkMode: 'class',

          extend: {
            colors: {
              'church-black': '#000000',
              'church-surface': '#0a0a0a',
              'church-green': '#10b981',
              'church-lime': '#bef264',
              'church-border': '#166534'
            }
          }
        }
      }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
      
      body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
      
      .dark body { background-color: #000000; color: #ffffff; }
      
      .custom-scrollbar::-webkit-scrollbar { width: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: #000000; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #10b981; border-radius: 10px; }
      
      .dark .glass-card {
        background: #0a0a0a;
        border: 1px solid rgba(16, 185, 129, 0.2);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      }

      .dark input, .dark textarea, .dark select {
        background-color: #000000 !important;
        border: 1px solid #166534 !important;
        color: #10b981 !important;
      }

      .dark input::placeholder {
        color: #064e3b !important;
      }
    </style>
  </head>
  <body class="dark transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
