
<!DOCTYPE html>
<html lang="pt-BR" class="notranslate" translate="no">

    <title>Escala Igreja - Black & Green</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'church-black': '#000000',
              'church-dark': '#0a0a0a',
              'church-green': '#10b981',
              'church-vibrant': '#22c55e',
              'church-neon': '#4ade80'
            }
          }
        }
      }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "react-qr-code": "https://esm.sh/react-qr-code@2.0.15?external=react,react-dom",

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
      
      body { font-family: 'Inter', sans-serif; }
      
      .dark body { background-color: #000000; color: #ffffff; }
      
      /* Scrollbar Verde */
      .custom-scrollbar::-webkit-scrollbar { width: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: #000000; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #10b981; border-radius: 10px; }
      
      /* Efeito de brilho em elementos verdes no tema escuro */
      .dark .neon-text {
        color: #10b981;
        text-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
      }
      
      .dark .neon-border {
        border-color: rgba(16, 185, 129, 0.4);
        box-shadow: 0 0 15px rgba(16, 185, 129, 0.1);
      }
    </style>
  </head>
  <body class="bg-slate-50 dark:bg-church-black transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
