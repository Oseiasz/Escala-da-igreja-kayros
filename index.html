
<!DOCTYPE html>
<html lang="pt-BR" class="notranslate" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escala Igreja - Charcoal Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'church-black': '#121214', // Cinza Grafite Profundo
              'church-surface': '#1e1e20', // Superfície mais clara
              'church-border': '#2d2d30', // Bordas sutis
              'church-zinc': '#3f3f46',
              'church-white': '#f4f4f5'
            },
            animation: {
              'shake': 'shake 0.4s cubic-bezier(.36,.07,.19,.97) both',
            },
            keyframes: {
              shake: {
                '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                '40%, 60%': { transform: 'translate3d(4px, 0, 0)' },
              }
            }
          }
        }
      }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "react-qr-code": "https://esm.sh/react-qr-code@2.0.15?external=react,react-dom",
    "@emailjs/browser": "https://esm.sh/@emailjs/browser@3.11.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
      
      body { 
        font-family: 'Inter', sans-serif; 
        transition: background-color 0.3s ease, color 0.3s ease; 
        -webkit-font-smoothing: antialiased;
      }
      
      .dark body { background-color: #121214; color: #f4f4f5; }
      
      .dark .glass-card {
        background: #1e1e20;
        border: 1px solid #2d2d30;
      }
      
      body:not(.dark) { background-color: #f4f4f5; color: #121214; }
      
      .custom-scrollbar::-webkit-scrollbar { width: 5px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 10px; }

      .dark input, .dark textarea, .dark select {
        background-color: #121214 !important;
        border: 1px solid #2d2d30 !important;
        color: #f4f4f5 !important;
      }

      .dark input::placeholder { color: #71717a; }
      
      input:focus, textarea:focus, select:focus {
        border-color: #a1a1aa !important;
        outline: none;
        box-shadow: 0 0 0 2px rgba(161, 161, 170, 0.2);
      }

      .animate-shake { animation: shake 0.4s ease-in-out; }
    </style>
  </head>
  <body class="dark">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
